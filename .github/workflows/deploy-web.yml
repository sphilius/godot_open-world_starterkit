# Exports the "Web" preset with Godot and deploys it to GitHub Pages.
# Runs on every push to main (docs-only changes are skipped) and on demand (Actions ▸ Run workflow).
# Live build: https://sphilius.github.io/godot_open-world_starterkit/
name: Deploy web build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore", ".gitattributes"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push queues behind a running deploy instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Cached per Godot version: the editor binary plus only the web export templates.
      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_RELEASE }}-linux-web

      - name: Install Godot and web templates (cache miss only)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" ~/godot/godot
          # The template archive is 1.2 GB; keep only the web templates (~85 MB) so the cache stays small.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/web*' 'templates/version.txt' -d "$dest"
          rm -rf /tmp/godot.zip /tmp/godot /tmp/templates.tpz
          ls -lh "$dest"

      # Builds the .godot import cache and the global class list the scripts depend on.
      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Export Web preset
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck   # fail loudly on a silent export error
          ls -lh build/web

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
